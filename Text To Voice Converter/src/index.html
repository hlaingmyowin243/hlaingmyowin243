<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Text To Voice Converter</title>
    <link
      rel="shortcut icon"
      href="./favicon/voice-note.png"
      type="image/x-icon"
    />
  </head>
  <body
    class="flex flex-col items-center h-screen justify-center bg-linear-to-r from-cyan-700 to-blue-500"
  >
    <div>
      <span class="text-white font-bold text-[30px]">Text To Speech </span
      ><span class="font-bold text-[30px] text-pink-300 border-b-3 pb-1"
        >Converter</span
      >
      <div class="flex flex-col mt-[50px]">
        <textarea
          name=""
          id=""
          class="rounded-md bg-gray-100/50 p-[10px] outline-none w-[500px] h-[250px] resize-none text-[18px]"
          placeholder="Enter Text"
        ></textarea>

        <button
          id="ListenBtn"
          class="flex items-center py-[10px] px-[30px] bg-pink-400 w-fit rounded-md cursor-pointer text-white font-semibold mt-[30px]"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
          >
            <path fill="currentColor" d="M8 19V5l11 7z" />
          </svg>
          <p>Listen</p>
        </button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
