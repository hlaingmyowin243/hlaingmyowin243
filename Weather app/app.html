<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather app</title>
  <link rel="shortcut icon" href="/favicon/clouds-and-sun.png" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    #searchCity:-webkit-autofill,
    #searchCity:-webkit-autofill:hover,
    #searchCity:-webkit-autofill:focus,
    #searchCity:-webkit-autofill:active {
      -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
      box-shadow: 0 0 0 1000px transparent inset !important;
      -webkit-text-fill-color: white !important;
      background-color: transparent !important;
      transition: background-color 5000s ease-in-out 0s;
    }

    #autocompleteDropdown {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 0.1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.25s ease;
      pointer-events: none;
    }

    #autocompleteDropdown.show {
      max-height: 320px;
      opacity: 1;
      overflow-y: auto;
      pointer-events: auto;
    }

    #autocompleteDropdown::-webkit-scrollbar {
      width: 4px;
    }
    #autocompleteDropdown::-webkit-scrollbar-track {
      background: transparent;
    }
    #autocompleteDropdown::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .autocomplete-item {
      padding: 10px 16px;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease;
      border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover,
    .autocomplete-item.active {
      background: rgba(255, 255, 255, 0.15);
    }

    .autocomplete-item .city-name {
      font-weight: 500;
    }

    .autocomplete-item .city-detail {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
    }

    .autocomplete-no-results {
      padding: 14px 16px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      font-size: 13px;
    }

    .autocomplete-loading {
      padding: 14px 16px;
      color: rgba(255, 255, 255, 0.4);
      text-align: center;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .autocomplete-loading .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="relative bg-[url('/asset/bg.jpg')] min-h-screen overflow-x-clip bg-cover bg-fixed bg-center w-full"
    id="bg-img">
    <!-- overlay + blur -->
    <div class="w-full min-h-[100vh] bg-black/40 pb-10">
      <div class="z-100 pt-5 text-white text-center">
        <p class="font-bold text-2xl">Weather app</p>
        <p class="text-sm font-light pt-2 text-white/50">
          forecasts for any location worldwide
        </p>
      </div>

      <div
        class="z-40 w-full flex-col sm:flex-row flex justify-center items-center gap-3 py-4 px-4 mb-4 transition-all duration-300">
        <!--input box-->
        <div class="relative w-full sm:w-[400px] md:w-[500px]">
          <div class="flex bg-white/10  py-1 px-4 rounded-md border-white/50 border-[0.1px] text-white">
            <input id="searchCity" type="text" class="w-full outline-none h-full" autocomplete="off"
              placeholder="Search for any city worldwide..." />
            <svg class="cursor-pointer" id="locationBtn" xmlns="http://www.w3.org/2000/svg" width="32" height="32"
              viewBox="0 0 24 24">
              <path fill="currentColor"
                d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 7.35q3.05-2.8 4.525-5.087T18 10.2q0-2.725-1.737-4.462T12 4T7.738 5.738T6 10.2q0 1.775 1.475 4.063T12 19.35M12 22q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22m0-12" />
            </svg>
          </div>
          <!-- Autocomplete dropdown -->
          <div id="autocompleteDropdown"
            class="absolute top-full left-0 w-full mt-1 rounded-md z-50">
          </div>
        </div>
        <!--input box-->

        <!--unit-->
        <div
          class="flex items-center bg-white/10 backdrop-blur-md justify-between rounded-md border-white/50 border-[0.1px] p-1 gap-2 text-white">
          <div id="celsiusBtn" class="active bg-white/50 py-2 px-3 cursor-pointer rounded-sm">
            °C
          </div>
          <div id="fahrenheitBtn" class="active py-2 px-3 cursor-pointer rounded-sm">°F</div>
        </div>
        <!--unit-->
      </div>

      <!--main section-->
      <div class="flex items-center justify-center">
        <div class="mt-5 w-full max-w-5xl flex flex-col md:flex-row gap-5 px-4">
          <!--left-->
          <div
            class="w-full md:w-[65%] lg:w-[70%] bg-white/10 backdrop-blur-md rounded-md border-white/50 border-[0.1px] p-4 sm:p-5 text-white">
            <div class="flex justify-between">
              <!--city-->
              <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-white/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor"
                      d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 7.35q3.05-2.8 4.525-5.087T18 10.2q0-2.725-1.737-4.462T12 4T7.738 5.738T6 10.2q0 1.775 1.475 4.063T12 19.35M12 22q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22m0-12" />
                  </svg>
                </div>
                <!--left-->
                <div>
                  <p class="font-semibold" id="city">New York</p>
                  <p class="font-light text-sm" id="country">US</p>
                </div>
              </div>
              <!--city-->

              <!--data and time-->
              <div>
                <p class="font-semibold text-sm text-white/50" id="currentDate">
                  Tuesday, Aug26
                </p>
                <p class="font-light text-sm text-end text-white/50" id="currentTime">
                  12:27 AM
                </p>
              </div>
              <!--data and time-->
            </div>

            <div class="flex justify-between items-center mt-10">
              <!--deg-->
              <div>
                <span class="text-4xl font-bold" id="temp">29</span>
                <span class="text-3xl font-light text-white/50" id="unitLabel">°C</span>
                <p class="text-md" id="description">Clear sky</p>
                <span class="text-md text-white/50" id="height">H:28°</span>
                <span class="text-md text-white/50" id="low">L:27°</span>
              </div>
              <!--deg-->

              <!--condition img-->
              <div id="mainIcon">
                <!-- Icon injected dynamically -->
              </div>
              <!--condition img-->
            </div>

            <!--condition-->
            <div class="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-3 mx-1">
              <!--visibility-->
              <div
                class="w-full h-auto min-h-[5rem] bg-white/20 rounded-md p-3 border-white/50 border-[0.1px] flex gap-2">
                <div class="w-5 h-5 rounded-full bg-white/20">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="currentColor"
                      d="M12.005 15.154q1.524 0 2.586-1.067t1.063-2.591t-1.067-2.587t-2.591-1.063t-2.587 1.067t-1.063 2.592t1.067 2.586t2.592 1.063M12 14.2q-1.125 0-1.912-.787T9.3 11.5t.788-1.912T12 8.8t1.913.788t.787 1.912t-.787 1.913T12 14.2m.003 3.8q-3.25 0-5.922-1.768T2.077 11.5q1.33-2.964 4.001-4.732T11.998 5t5.921 1.768t4.004 4.732q-1.33 2.964-4.001 4.732T12.002 18M12 17q2.825 0 5.188-1.487T20.8 11.5q-1.25-2.525-3.613-4.012T12 6T6.813 7.488T3.2 11.5q1.25 2.525 3.613 4.013T12 17" />
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/70">visibility</p>
                  <p id="visibility">10.0km</p>
                </div>
              </div>
              <!--visibility-->

              <!--wind speed-->
              <div
                class="w-full h-auto min-h-[5rem] bg-white/20 rounded-md p-3 border-white/50 border-[0.1px] flex gap-2">
                <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5">
                      <path
                        d="M2 5.941c3.5 3.432 8.576 1.961 9.732 0c.17-.288.268-.623.268-.98C12 3.878 11.105 3 10 3s-2 .878-2 1.961m9 3.967C17 7.311 18.12 6 19.5 6S22 7.311 22 8.928a3.23 3.23 0 0 1-.585 1.883C19.346 14.191 9.276 12.916 4 11.856m9.085 8.031c.206.649.762 1.113 1.415 1.113c.828 0 1.5-.747 1.5-1.669c0-.313-.078-.607-.213-.857C14.5 15.992 8 14.324 2 18.774" />
                      <path stroke-linejoin="round" d="M19 15.5h2" />
                    </g>
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/70">Wind speed</p>
                  <p id="windSpeed"></p>
                </div>
              </div>
              <!--wind speed-->

              <!--humidity-->
              <div
                class="w-full h-auto min-h-[5rem] bg-white/20 rounded-md p-3 border-white/50 border-[0.1px] flex gap-2">
                <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                    <path fill="currentColor"
                      d="M10 22q-3.325 0-5.663-2.3T2 14.1q0-1.575.613-3.012T4.35 8.55L10 3l5.65 5.55q1.125 1.1 1.738 2.538T18 14.1q0 3.3-2.337 5.6T10 22Zm8.5-12q0-1.875-1.313-3.188T14 5.5q1.875 0 3.188-1.313T18.5 1q0 1.875 1.313 3.188T23 5.5q-1.875 0-3.188 1.313T18.5 10Z" />
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/70">humidity</p>
                  <p id="humidity"></p>
                </div>
              </div>
              <!--humidity-->

              <!--pressure-->
              <div
                class="w-full h-auto min-h-[5rem] bg-white/20 rounded-md p-3 border-white/50 border-[0.1px] flex gap-2">
                <div class="w-5 h-5 rounded-full bg-white/20 flex items-center justify-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                    <g fill="none" stroke="currentColor">
                      <path stroke-linecap="round" d="M20.693 17.33a9 9 0 1 0-17.386 0" />
                      <path
                        d="M12.766 15.582c.487.71.144 1.792-.766 2.417c-.91.626-2.043.558-2.53-.151c-.52-.756-2.314-5.007-3.403-7.637c-.205-.495.4-.911.79-.542c2.064 1.96 5.39 5.157 5.909 5.913Z" />
                      <path stroke-linecap="round"
                        d="M12 6v2m-6.364.636L7.05 10.05m11.314-1.414L16.95 10.05m3.743 7.28l-1.931-.518m-15.455.518l1.931-.518" />
                    </g>
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/70">pressure</p>
                  <p id="pressure"></p>
                </div>
              </div>
              <!--pressure-->

              <!--feels like-->
              <div
                class="w-full h-auto min-h-[5rem] bg-white/20 rounded-md p-3 border-white/50 border-[0.1px] flex gap-2">
                <div class="w-5 h-5 rounded-full bg-white/20 flex justify-center items-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24">
                    <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                      stroke-width="2" d="M10 13.5a4 4 0 1 0 4 0V5a2 2 0 0 0-4 0zM10 9h4" />
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/70">feels like</p>
                  <p id="feelsLike"></p>
                </div>
              </div>
              <!--feels like-->
            </div>
            <!--condition-->

            <!--sun rise and sun set-->
            <div class="flex flex-col sm:flex-row w-full gap-3 items-center justify-center mt-5">
              <!--sunrise-->
              <div
                class="w-full sm:w-[50%] h-auto min-h-[5rem] bg-gradient-to-r from-yellow-300/20 to-orange-400/20 backdrop-blur-md border-white/50 border-[0.1px] rounded-md p-3 flex gap-2">
                <div class="flex items-center justify-center bg-yellow-300/50 w-7 h-7 rounded-full">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 1024 1024">
                    <path fill="currentColor"
                      d="M1024 759q-97 62-96 137q1 36 4 55q92 33 92 73H0q0-40 93-74q3-27 3-54q-2-77-96-137q255-11 137-237q227 117 238-138q60 94 137 96q75 2 137-96q11 255 238 138q-118 226 137 237M512 576q-87 0-161 43T234.5 735.5T192 896q0 12 1 28q30-6 64-11q-1-15-1-17q0-106 75-181t181-75t181 75t75 181q0 3-1 17q34 5 64 11q1-17 1-28q0-87-42.5-160.5T673 619t-161-43m64-384v96q0 13-9.5 22.5T544 320h-64q-13 0-22.5-9.5T448 288v-96H335q-25-22-8-37L489 9q9-9 23-9t24 9l162 146q16 15-9 37z" />
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/50">sunrise</p>
                  <p id="sunrise"></p>
                </div>
              </div>
              <!--sunrise-->

              <!--sunset-->
              <div
                class="w-full sm:w-[50%] h-auto min-h-[5rem] bg-gradient-to-r from-purple-400/50 to-blue-400/20 backdrop-blur-md border-white/50 border-[0.1px] rounded-md p-3 flex gap-2">
                <div class="flex items-center justify-center bg-purple-300/50 w-7 h-7 rounded-full">
                  <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 1024 1024">
                    <path fill="currentColor"
                      d="M1024 759q-97 62-96 137q1 36 4 55q92 33 92 73H0q0-40 93-74q3-28 3-54q-2-77-96-137q255-11 137-237q227 117 238-138q60 94 137 96q75 2 137-96q11 255 238 138q-118 226 137 237M512 576q-87 0-161 43T234.5 735.5T192 896q0 12 1 28q30-6 64-11q-1-15-1-17q0-106 75-181t181-75t181 75t75 181q0 2-1 17q34 5 64 11q1-17 1-28q0-87-43-160.5T672.5 619T512 576m24-265q-10 9-24 9t-23-9L327 165q-17-15 8-37h113V32q0-13 9.5-22.5T480 0h64q13 0 22.5 9.5T576 32v96h113q25 22 9 37z" />
                  </svg>
                </div>

                <div class="flex flex-col gap-2">
                  <p class="text-sm font-light text-white/50">sunset</p>
                  <p id="sunset"></p>
                </div>
              </div>
              <!--sunset-->
            </div>
            <!--sun rise and sun set-->
          </div>
          <!--left-->

          <!--right-->
          <div
            class="w-full md:w-[35%] lg:w-[30%] bg-white/10 backdrop-blur-md rounded-md border-white/50 border-[0.1px] p-4 sm:p-5 text-white">
            <!--calender-->
            <div class="flex items-center gap-3">
              <div class="p-1 bg-white/20 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24">
                  <!-- Icon from Unicons by Iconscout - https://github.com/Iconscout/unicons/blob/master/LICENSE -->
                  <path fill="currentColor"
                    d="M19 4h-2V3a1 1 0 0 0-2 0v1H9V3a1 1 0 0 0-2 0v1H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3m1 15a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-7h16Zm0-9H4V7a1 1 0 0 1 1-1h2v1a1 1 0 0 0 2 0V6h6v1a1 1 0 0 0 2 0V6h2a1 1 0 0 1 1 1Z" />
                </svg>
              </div>

              <p class="text-lg font-semibold">5 days forecast</p>
            </div>
            <!--calender-->

            <!--daily-->
            <div id="forecastContainer" class="daily-container mt-5 flex flex-col gap-3">
              <p class="text-sm text-white/50 text-center py-5">Search a city to see the 5-day forecast</p>
            </div>
            <!--daily-->
          </div>
          <!--right-->
        </div>
      </div>
      <!--main section-->
    </div>
    <!-- overlay + blur -->
  </div>
  <script src="app.js"></script>
</body>

</html>
