<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Email Subscription</title>
    <link rel="shortcut icon" href="./favicon/mail.png" type="image/x-icon" />
  </head>
  <body>
    <div
      class="bg-[url('./asset/photo.jpg')] w-full h-screen bg-cover bg-center"
    ></div>
    <div class="absolute inset-0 bg-black/60 h-screen w-full"></div>
    <div class="mt-[100px] absolute top-0 text-white ml-[100px]">
      <p class="text-2xl">Coming Soon</p>
      <p class="pt-[30px] text-[50px] font-bold w-[60%] leading-15">
        Our Brand New Website Is On It's Way
      </p>
      <p class="text-md pt-[20px]">Subscribe for more details</p>
      <form
        class="w-[400px] bg-white flex justify-between mt-[40px]"
        name="submit-to-google-sheet"
      >
        <input
          required
          type="email"
          name="email"
          placeholder="Enter your email"
          class="w-full text-black p-[10px] outline-0"
        />
        <button type="submit" id="">
          <img
            src="./asset/send.png"
            alt=""
            class="w-[30px] mr-[10px] cursor-pointer"
          />
        </button>
      </form>
      <p class="mt-[10px]" id="msg"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
