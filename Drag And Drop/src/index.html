<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./output.css" rel="stylesheet" />
  <title>Drag And Drop</title>
  <link rel="shortcut icon" href="./favicon/drag-and-drop.png" type="image/x-icon" />
</head>

<body class="flex justify-center items-center h-screen w-full bg-linear-to-r from-cyan-500 to-blue-950">
  <label for="input-file" id="drop-area" class="w-[500px] h-[300px] bg-white rounded-2xl p-[20px] cursor-pointer">
    <input type="file" name="" id="input-file" accept="image/*" class="hidden" />
    <div id="imgContainer"
      class="w-full h-full border border-dotted border-blue-400 rounded-2xl flex flex-col justify-center items-center">
      <div class="w-full h-full flex flex-col justify-center items-center rounded-2xl bg-center bg-cover"
        id="imageView">
        <img src="./asset/upload.png" alt="" class="w-[100px]" />
        <div class="w-full flex flex-col justify-center items-center mt-[20px] gap-3">
          <p class="w-[45%] text-center font-light text-black/80">
            Drag and drop or click here to upload image
          </p>
          <p class="text-sm text-black/50">Upload any images from desktop</p>
        </div>
      </div>
    </div>
  </label>
  <script src="script.js"></script>
</body>

</html>
