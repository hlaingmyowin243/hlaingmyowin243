<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Image Search Engine</title>
    <link
      rel="shortcut icon"
      href="./favicon/website-image-search.png"
      type="image/x-icon"
    />
  </head>
  <body
    class="bg-[#1f1f1f] flex justify-center mt-[100px] items-center flex-col"
  >
    <div>
      <p class="text-[25px] font-semibold text-white text-center">
        Image Search Engine
      </p>

      <!--search-->
      <div
        class="w-[600px] bg-[#4d5156] flex items-center rounded-[30px] p-2 text-white mt-5"
      >
        <input
          id="searchbox"
          type="text"
          class="w-full outline-none p-3 bg-[#4d5156] text-white autofill:bg-[#4d5156] autofill:text-white"
          placeholder="Search anything here"
        />
        <button
          id="search-btn"
          class="py-3 px-7 border-2 border-gray-400 rounded-3xl text-white cursor-pointer hover:bg-gray-500/100 transition-all duration-500"
        >
          Search
        </button>
      </div>
      <!--search-->
    </div>
    <div id="searchresult" class="grid grid-cols-3 gap-2 w-[80%] mt-5"></div>
    <button
      id="show-more-btn"
      class="py-2 px-6 bg-[#4d5156] rounded-xl mt-3 cursor-pointer text-white hidden mb-6"
    >
      Show more
    </button>
    <script src="app.js"></script>
  </body>
</html>
